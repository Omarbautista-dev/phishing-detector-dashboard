<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Phishing</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Iconos de FontAwesome para la barra de búsqueda -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Encabezado / Barra superior -->
<header class="header">
    <h1 class="logo">Detector de Phishing</h1>
    <span class="author">Created by: Omar & John</span>
</header>

<!-- Contenedor Principal Dashboard -->
<main class="dashboard-container">

    <!-- Panel Izquierdo: URLS Analizadas -->
    <aside class="panel urls-panel">
        <h2 class="panel-title">URLS Analizadas</h2>
        <div class="filter-pills">
            <button class="pill active" data-filter="todos">Todos</button>
            <button class="pill" data-filter="segura">Seguras</button>
            <button class="pill" data-filter="sospechosa">Sospechosas</button>
            <button class="pill" data-filter="critica">Criticas</button>
        </div>
        <div class="list-container">
            <ul class="url-list" id="url-list"></ul>
        </div>
    </aside>

    <!-- Área Principal Derecha -->
    <section class="main-content">

        <!-- Barra de Búsqueda / Input -->
        <div class="search-section">
            <form class="search-bar" id="analyze-form">
                <i class="fa-solid fa-bars menu-icon"></i>
                <input type="text" id="url-input" placeholder="Ingrese la URL a analizar" autocomplete="off">
                <button type="submit" id="analyze-btn" aria-label="Analizar"><i class="fa-solid fa-magnifying-glass search-icon"></i></button>
            </form>
        </div>

        <!-- Grilla para Indicadores y Medidas -->
        <div class="grid-two-columns">

            <!-- Panel de Indicadores de Phishing -->
            <div class="panel indicators-panel">
                <h2 class="panel-title">Indicadores de Phishing</h2>
                <div class="chart-container">
                    <div class="pie-chart" id="risk-chart"></div>
                </div>
                <div id="risk-score" class="risk-score">Sin análisis</div>
                <div class="legend-grid" id="indicators-legend">
                    <div class="legend-item" data-ind="ip"><span class="color-box c1"></span> IP explícita</div>
                    <div class="legend-item" data-ind="length"><span class="color-box c2"></span> Longitud &gt; 75</div>
                    <div class="legend-item" data-ind="subdomains"><span class="color-box c3"></span> +3 subdominios</div>
                    <div class="legend-item" data-ind="keywords"><span class="color-box c4"></span> Palabras clave</div>
                    <div class="legend-item" data-ind="https"><span class="color-box c5"></span> Sin HTTPS</div>
                    <div class="legend-item" data-ind="at"><span class="color-box c6"></span> Arroba (@)</div>
                    <div class="legend-item" data-ind="dash"><span class="color-box c7"></span> Guion en dominio</div>
                </div>
            </div>

            <!-- Panel de Medidas Recomendadas -->
            <div class="panel measures-panel">
                <h2 class="panel-title">Medidas Recomendadas</h2>
                <div class="measures-container" id="measures-list">
                    <div class="measure-row">Sin análisis — ingresa una URL.</div>
                </div>
            </div>

        </div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
